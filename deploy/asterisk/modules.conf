; Only what the dsh-phone relay needs: PJSIP, G.711/G.722, the dialplan apps it uses, AMI (core).
; No chan_sip (gone in 22), no IAX, no sample dialplans, no HTTP/ARI, no CDR backends.
[modules]
autoload = no

; core services
load => res_timing_timerfd.so
load => res_security_log.so
load => res_sorcery_config.so
load => res_sorcery_memory.so
load => res_sorcery_astdb.so
load => res_rtp_asterisk.so
load => res_srtp.so

; PJSIP
load => res_pjproject.so
load => res_pjsip.so
load => res_pjsip_session.so
load => chan_pjsip.so
; server audio route: AudioSocket channel to phone-hookd on 127.0.0.1 only
load => res_audiosocket.so
load => chan_audiosocket.so
load => res_pjsip_outbound_registration.so
load => res_pjsip_authenticator_digest.so
load => res_pjsip_outbound_authenticator_digest.so
load => res_pjsip_endpoint_identifier_ip.so
load => res_pjsip_endpoint_identifier_anonymous.so
load => res_pjsip_nat.so
load => res_pjsip_sdp_rtp.so
load => res_pjsip_caller_id.so
load => res_pjsip_header_funcs.so
load => res_pjsip_logger.so
load => res_pjsip_dtmf_info.so
load => res_pjsip_rfc3326.so
load => res_pjsip_pubsub.so
load => res_pjsip_outbound_publish.so

; codecs and formats
load => codec_alaw.so
load => codec_ulaw.so
load => codec_a_mu.so
load => codec_g722.so
load => format_wav.so
load => format_pcm.so

; dialplan
load => pbx_config.so
load => app_dial.so
load => app_stack.so
load => app_verbose.so
load => func_callerid.so
load => func_channel.so
load => func_cut.so
load => func_logic.so
load => func_lock.so
load => func_groupcount.so
load => func_sha1.so
load => func_strings.so

; bridging
load => bridge_simple.so
load => bridge_native_rtp.so
