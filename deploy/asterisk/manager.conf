; Asterisk Manager Interface: loopback only. The one user (dsh-phone, read
; system, write system+config) is GENERATED by phone-hookd into
; dsh-phone/manager.conf; its secret also lives 0600 in ~/.dsh/phone/relay.json.
[general]
enabled = yes
webenabled = no
port = 5038
bindaddr = 127.0.0.1
displayconnects = no
timestampevents = yes
authtimeout = 10
authlimit = 10

#include dsh-phone/manager.conf
