; PJSIP for the dsh-phone relay. Transports, accounts and the Twilio bridge are
; GENERATED by phone-hookd into dsh-phone/pjsip.conf (bound to the LAN address
; and 127.0.0.1 only). Everything not identified lands on [anonymous], whose
; context only hangs up.
[global]
type = global
user_agent = dsh-phone-relay
endpoint_identifier_order = ip,anonymous
unidentified_request_count = 3
unidentified_request_period = 5
unidentified_request_prune_interval = 30
keep_alive_interval = 30
max_forwards = 20
default_realm = dsh-phone

[anonymous]
type = endpoint
context = dshp-hangup
disallow = all
allow = alaw,ulaw
allow_subscribe = no
direct_media = no

#include dsh-phone/pjsip.conf
