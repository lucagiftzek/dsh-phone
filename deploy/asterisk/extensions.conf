; Dialplan for the dsh-phone relay. The contexts are GENERATED by phone-hookd
; into dsh-phone/extensions.conf. Anything else ends in a hangup.
[general]
static = yes
writeprotect = yes
clearglobalvars = yes
autofallthrough = yes

[default]
exten => _[0-9a-zA-Z+*#].,1,Hangup(21)
exten => s,1,Hangup(21)

[public]
exten => _[0-9a-zA-Z+*#].,1,Hangup(21)
exten => s,1,Hangup(21)

#include dsh-phone/extensions.conf
