; dsh-phone relay logging. security.log carries the PJSIP security events
; (failed auth, unidentified requests, ACL hits) in the format fail2ban's
; asterisk filter reads; messages.log also gets the dialplan's
; "dsh-phone-security:" lines for denied bridge calls.
[general]
dateformat = %F %T
use_callids = yes
appendhostname = no

[logfiles]
console => notice,warning,error
messages.log => notice,warning,error,security
security.log => security
